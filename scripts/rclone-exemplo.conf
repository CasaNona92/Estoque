# Modelo do rclone.conf (o rclone guarda em %APPDATA%\rclone\rclone.conf).
# Prefira criar com "rclone config" — assim você não precisa colar segredos em arquivos.
# NUNCA versione o arquivo real.

[r2-fotos]
type = s3
provider = Cloudflare
access_key_id = COLE_AQUI
secret_access_key = COLE_AQUI
endpoint = https://SEU_ACCOUNT_ID.r2.cloudflarestorage.com
acl = private
no_check_bucket = true

[r2-backups]
type = s3
provider = Cloudflare
access_key_id = COLE_AQUI
secret_access_key = COLE_AQUI
endpoint = https://SEU_ACCOUNT_ID.r2.cloudflarestorage.com
acl = private
no_check_bucket = true
